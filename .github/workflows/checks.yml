name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  MATCHER_USE_LLM: 'false'
  OPENAI_API_KEY: ''
  CATALOG_BACKEND: csv
  ADMIN_TOKEN: ''

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest -v
      - run: python -m pip check

  database-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nur_test
          POSTGRES_USER: nur
          POSTGRES_PASSWORD: ci-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nur -d nur_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://nur:ci-local-password@127.0.0.1:5432/nur_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s integration -v
      - run: python -m unittest discover -s e2e -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose run --build --rm tests
      - run: docker compose up --build -d --wait web
      - name: Check runtime assets and metrics
        run: |
          curl --fail http://127.0.0.1:8080/health
          curl --fail http://127.0.0.1:8080/metrics
          curl --fail --output /dev/null http://127.0.0.1:8080/
          curl --fail --output /dev/null http://127.0.0.1:8080/selection
          curl --fail --output /dev/null http://127.0.0.1:8080/assets/home.js
          curl --fail --output /dev/null http://127.0.0.1:8080/assets/about.js
          curl --fail --output /dev/null http://127.0.0.1:8080/assets/cards.js
          curl --fail --output /dev/null http://127.0.0.1:8080/assets/admin.js
      - if: always()
        run: docker compose logs --tail=100 web
      - if: always()
        run: docker compose down
