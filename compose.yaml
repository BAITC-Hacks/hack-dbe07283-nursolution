services:
  web:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    environment:
      MATCHER_USE_LLM: "${MATCHER_USE_LLM:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      MATCHER_TIMEOUT_SECONDS: "${MATCHER_TIMEOUT_SECONDS:-8}"
      EXPLANATION_CACHE_TTL_SECONDS: "${EXPLANATION_CACHE_TTL_SECONDS:-600}"
      EXPLANATION_CACHE_MAX_ENTRIES: "${EXPLANATION_CACHE_MAX_ENTRIES:-256}"
      LLM_MAX_CONCURRENCY: "${LLM_MAX_CONCURRENCY:-4}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      CATALOG_BACKEND: "${CATALOG_BACKEND:-csv}"
      DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql://nur:${POSTGRES_PASSWORD:-nur_local_dev}@db:5432/nur}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      MATCHER_USE_LLM: "false"
      OPENAI_API_KEY: ""
      CATALOG_BACKEND: "csv"
      ADMIN_TOKEN: ""
    init: true
    read_only: true
    tmpfs:
      - /tmp

  db:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: nur
      POSTGRES_USER: nur
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nur_local_dev}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nur -d nur"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
